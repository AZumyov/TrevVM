name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: Shell, Python and installer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: ./scripts/ci.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the base image (retry)
        run: |
          for attempt in 1 2 3; do
            if docker pull ghcr.io/linuxserver/baseimage-kasmvnc:ubuntujammy; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trevvm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
